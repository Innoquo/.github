name: Update catalogue statistics

on:
  schedule:
    - cron: "17 04 * * *"
  workflow_dispatch:

concurrency:
  group: catalogue-statistics
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Read lab manifests and update generated files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_catalog_stats.py

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- profile/README.md generated/catalog-stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated catalogue data
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/catalogue-statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git switch -C "$BRANCH"
          git add profile/README.md generated/catalog-stats.json
          git commit -m "chore: update catalogue statistics"
          git push --force-with-lease origin "HEAD:$BRANCH"

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/catalogue-statistics
        shell: bash
        run: |
          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$existing_pr" ]]; then
            echo "Updated existing pull request #$existing_pr"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "chore: update catalogue statistics" \
              --body "Automated update generated from validated public lab.yaml manifests. Review the metric and catalogue changes before merging."
          fi
